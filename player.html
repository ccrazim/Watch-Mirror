<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Mov</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body class="player-page">
    <a class="back-button" href="index.html" aria-label="Back to home">&#8592;</a>
    <main>
      <div>
        <span id="episode-controls" hidden>
          <label for="season-number">Season:</label>
          <input id="season-number" type="number" min="1" value="1">
          <label for="episode-number">Episode:</label>
          <input id="episode-number" type="number" min="1" value="1">
          <button id="load-episode" type="button">Load episode</button>
        </span>
        <div class="player-url-row">
          <span>If it says 'Please Disable Sandbox' or isn't loading, try <a id="player-url-link" href="#" target="_blank" rel="noopener noreferrer">this</a>.</span>
        </div>
      </div>
      <div id="player-container">
        <h1>Loading...</h1>
      </div>
    </main>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const tmdbId = urlParams.get("tmdbid");
      const mediaType = urlParams.get("type") || "movie";

      const playerContainer = document.getElementById("player-container");
      const episodeControls = document.getElementById("episode-controls");
      const seasonInput = document.getElementById("season-number");
      const episodeInput = document.getElementById("episode-number");
      const loadEpisodeButton = document.getElementById("load-episode");
      const playerUrlLink = document.getElementById("player-url-link");

      if (mediaType === "tv") {
        episodeControls.hidden = false;
      }

      function loadPlayer(source) {
        if (tmdbId) {
          const iframe = document.createElement("iframe");
          iframe.allow = "autoplay; fullscreen";
          iframe.allowFullscreen = true;

          if (source === "mainstream") {
            if (mediaType === "tv") {
              const season = Math.max(1, Number.parseInt(seasonInput.value, 10) || 1);
              const episode = Math.max(1, Number.parseInt(episodeInput.value, 10) || 1);
              seasonInput.value = season;
              episodeInput.value = episode;
              iframe.src = `https://cinesrc.st/embed/tv/${tmdbId}?s=${season}&e=${episode}`;
            } else {
              iframe.src = `https://cinesrc.st/embed/movie/${tmdbId}`;
            }
          }

          playerUrlLink.href = iframe.src;

          playerContainer.innerHTML = "";
          playerContainer.appendChild(iframe);
        } else {
          playerContainer.innerHTML = "<h1>error: no content found :c</h1>";
        }
      }

      loadPlayer("mainstream");

      loadEpisodeButton.addEventListener("click", () => {
        loadPlayer("mainstream");
      });

    </script>
  </body>
</html>
